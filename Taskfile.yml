# https://taskfile.dev

version: '3'

tasks:

  default:
    cmds:
      - task -l
    silent: true

  init_mise:
    desc: Initialises the project - mise
    sources:
      - mise.toml
    generates:
      - mise.lock
    cmds:
      - mise install

  init_precommit:
    desc: Initialises the project - pre-commit
    deps:
      - init_mise
    sources:
      - .pre-commit-config.yaml
    cmds:
      - pre-commit install

  init:
    desc: Initialises the project
    deps:
      - init_mise
      - init_precommit

  test:
    desc: Test the project
    deps:
      - init
    cmds:
      - TMPDIR=$(mktemp -d) && boilerplate --template-url . --output-folder $TMPDIR && rm -r $TMPDIR
